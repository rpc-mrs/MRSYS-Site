# /nginx/nginx.conf
server {
    listen 80;
    server_name mrsys.ru www.mrsys.ru;

    # Проверка от Let's Encrypt для выпуска SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Перенаправление с HTTP на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mrsys.ru www.mrsys.ru;

    # Пути к SSL сертификатам (Certbot положит их сюда)
    ssl_certificate /etc/letsencrypt/live/mrsys.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mrsys.ru/privkey.pem;

    # Оптимизация SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Проксирование запросов в контейнер Next.js
    location / {
        proxy_pass http://nextjs_app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded-for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
